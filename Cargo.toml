[package]
name = "memeasm"
version = "1.6.0"
edition = "2021"
description = "The MemeAssembly compiler"
license = "GPL-3.0-or-later"
repository = "https://github.com/kammt/MemeAssembly"
build = "build.rs"

[[bin]]
name = "memeasm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 2
