[package]
name = "memeasm"
version = "2.0.0"
edition = "2021"
description = "The MemeAssembly compiler"
license = "GPL-3.0-or-later"
repository = "https://github.com/kammt/MemeAssembly"

[[bin]]
name = "memeasm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
