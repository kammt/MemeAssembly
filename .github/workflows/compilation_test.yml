
name: Compilation Test

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main/develop branch
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  compile_linux:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Runs a single command using the runners shell
      - name: compile the project
        run: make CARGO_FLAGS=--locked debug

      - name: run the compiler on example.memeasm
        run: ./memeasm -S -d -o example.S .github/workflows/example.memeasm

      - name: Install memeasm
        run: |
          make CARGO_FLAGS=--locked
          sudo make install

      - name: Function parser tests
        run: |
          cd .github/workflows/multiple_files
          make || exit 1
          make fail_undefined && exit 1
          make fail_no_main && exit 1
          exit 0

      # The examples link object files created with -O against C code, which needs gcc
      - name: Compile all code examples
        run: |
          cd examples
          make

  compile_windows:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile memeasm
        shell: powershell
        run: |
          cargo build --locked
          Copy-Item target\debug\memeasm.exe memeasm.exe

      - name: Run compiler on example.memeasm
        shell: powershell
        run: ./memeasm.exe -S -d -o example.S .github\workflows\example.memeasm

      # PowerShell does not expand wildcards for native commands, so the files are listed explicitly
      - name: Check that compiling multiple input files works
        run: ./memeasm.exe -d -o tmp.exe .github/workflows/multiple_files/main.memeasm .github/workflows/multiple_files/function.memeasm

  compile_macos:
    # The type of runner that the job will run on
    runs-on: macos-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Runs a single command using the runners shell
      - name: compile the project
        run: make CARGO_FLAGS=--locked debug

      - name: run the compiler on example.memeasm
        run: ./memeasm -S -d -o example.S .github/workflows/example.memeasm

      - name: Install memeasm
        run: |
          make CARGO_FLAGS=--locked
          sudo make install

      - name: Function parser tests
        run: |
          cd .github/workflows/multiple_files
          make || exit 1
          make fail_undefined && exit 1
          make fail_no_main && exit 1
          exit 0

      # memeasm always generates x86_64 code, so the C code has to be compiled for x86_64 too
      # (the runner may be an arm64 machine)
      - name: Compile all code examples
        run: |
          cd examples
          make CC="cc -arch x86_64"
